# GitHub Pages configuration for the project hub
title: Maxim4to Projects
description: A hub for Maxim4to projects, including Flowen Tracker and Mars Defence
baseurl: ""
url: ""

# GitHub Pages settings
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Exclude files from processing
exclude:
  - start_server.py
  - README.md
  - .gitignore

# Include files
include:
  - app-ads.txt
  - .htaccess

# Default settings
defaults:
  - scope:
      path: ""
    values:
      layout: default
